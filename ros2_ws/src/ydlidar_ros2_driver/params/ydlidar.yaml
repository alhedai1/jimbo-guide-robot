ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ttyUSB0
    baudrate: 128000
    lidar_type: 1
    device_type: 0
    sample_rate: 4
    abnormal_check_count: 4
    resolution_fixed: true
    reversion: true
    inverted: false
    auto_reconnect: true
    isSingleChannel: true
    intensity: false
    support_motor_dtr: true  # IMPORTANT for X4
    angle_max: 180.0
    angle_min: -180.0
    range_max: 12.0
    range_min: 0.1
    frequency: 7.0
    frame_id: laser_frame
