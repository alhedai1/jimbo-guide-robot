controller_server:
  ros__parameters:
    use_sim_time: false
    controller_plugins: ["dwb_controller"]
    dwb_controller:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: 0.0
      max_vel_x: 0.3
      max_vel_theta: 0.5
      acc_lim_x: 0.5
      acc_lim_theta: 0.5
      vx_samples: 10
      sim_time: 1.0
      linear_granularity: 0.05
      goal_checker:
        plugin: "dwb_plugins::SimpleGoalChecker"
        xy_goal_tolerance: 0.1
        yaw_goal_tolerance: 0.1

local_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_footprint
    update_frequency: 5.0
    publish_frequency: 2.0
    resolution: 0.05
    plugins: ["obstacle_layer", "inflation_layer"]
    obstacle_layer:
      observation_sources: scan
      scan:
        topic: /scan
        data_type: LaserScan
        clearing: true
        marking: true
        max_obstacle_height: 2.0
    inflation_layer:
      inflation_radius: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"

recoveries_server:
  ros__parameters:
    use_sim_time: false
