amcl:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_plugins: ["dwb_controller"]
    dwb_controller:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: 0.0
      max_vel_x: 0.3
      max_vel_theta: 0.5
      acc_lim_x: 0.5
      acc_lim_theta: 0.5
      vx_samples: 10
      sim_time: 1.0
      linear_granularity: 0.05
      goal_checker:
        plugin: "dwb_plugins::SimpleGoalChecker"
        xy_goal_tolerance: 0.1
        yaw_goal_tolerance: 0.1
      critics: ["ObstacleFootprintCritic", "GoalDistCritic", "PathAlignCritic"]

      GoalDistCritic:
        scale: 1.0
      PathAlignCritic:
        scale: 32.0
      ObstacleFootprintCritic:
        scale: 0.015

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      allow_unknown: true

bt_navigator:
  ros__parameters:
    use_sim_time: false
    # default_bt_xml_filename: "/home/jimbo/jimbo-guide-robot/ros2_ws/src/jimbo_navigation/config/follow_goal_bt.xml"
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"
    global_frame: odom

recoveries_server:
  ros__parameters:
    use_sim_time: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.05
      width: 5
      height: 5
      rolling_window: true
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
